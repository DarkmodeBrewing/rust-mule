name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  docs-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install docs dependencies
        run: npm install
      - name: Build docs site
        run: npm run docs:build

  build-matrix:
    name: build-matrix-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact_glob: dist/*.tar.gz
            build_cmd: scripts/build/build_linux_release.sh
          - os: macos-latest
            label: macos-arm64
            artifact_glob: dist/*-macos-arm64.tar.gz
            build_cmd: MACOS_BUILD_TARGET=aarch64-apple-darwin scripts/build/build_macos_release.sh
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            label: macos-x86_64
            artifact_glob: dist/*-macos-x86_64.tar.gz
            build_cmd: MACOS_BUILD_TARGET=x86_64-apple-darwin scripts/build/build_macos_release.sh
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            label: windows
            artifact_glob: dist/*.zip
            build_cmd: ./scripts/build/build_windows_release.ps1
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (default host target)
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install Rust (macOS target)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release bundle (Linux/macOS)
        if: runner.os != 'Windows'
        run: ${{ matrix.build_cmd }}
        shell: bash
      - name: Build release bundle (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.build_cmd }}
        shell: pwsh
      - name: Verify release artifact exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ls -l dist
          compgen -G "${{ matrix.artifact_glob }}" >/dev/null
        shell: bash
      - name: Smoke packaged artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          archive="$(compgen -G "${{ matrix.artifact_glob }}" | head -n 1)"
          bash scripts/build/smoke_unix_release.sh "${archive}"
        shell: bash
      - name: Verify release artifact exists (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem dist
          if (-not (Get-ChildItem -Path "${{ matrix.artifact_glob }}" -ErrorAction SilentlyContinue)) {
            throw "Expected release artifact matching ${{ matrix.artifact_glob }}"
          }
        shell: pwsh
      - name: Smoke packaged artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          $archive = Get-ChildItem -Path "${{ matrix.artifact_glob }}" | Select-Object -First 1
          ./scripts/build/smoke_windows_release.ps1 -Archive $archive.FullName
        shell: pwsh

  kad-scripts-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: KAD script syntax checks
        run: |
          bash -n scripts/test/kad_phase0_baseline.sh
          bash -n scripts/test/kad_phase0_compare.sh
          bash -n scripts/test/kad_phase0_ci_smoke.sh
      - name: KAD baseline/compare offline smoke
        run: bash scripts/test/kad_phase0_ci_smoke.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --all-features

  ui-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run UI smoke tests
        run: npm run test:ui:smoke

  coverage:
    runs-on: ubuntu-latest
    env:
      MIN_LINES_COVERAGE: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-features --summary-only
      - name: Line coverage gate
        run: scripts/test/coverage.sh
